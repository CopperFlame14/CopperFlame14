<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">

<style>

text{
font-family:JetBrains Mono,monospace;
fill:#C9D1D9;
}

.title{
font-size:28px;
fill:#A371F7;
font-weight:bold;
}

.label{
font-size:18px;
fill:#A371F7;
}

.value{
font-size:18px;
fill:#E6EDF3;
}

.small{
font-size:15px;
fill:#8B949E;
}

.online{
fill:#3FB950;
}

.glow{
animation:glow 2s infinite alternate;
}

.cursor{
animation:blink 1s infinite;
}

.scan{
animation:scan 4s linear infinite;
}

@keyframes glow{

0%{
filter:drop-shadow(0 0 2px #A371F7);
}

100%{
filter:drop-shadow(0 0 12px #58A6FF);
}

}

@keyframes blink{

50%{
opacity:0;
}

}

@keyframes scan{

0%{
transform:translateY(-220px);
}

100%{
transform:translateY(220px);
}

}

</style>

<!-- Background -->

<rect width="900" height="430" rx="18" fill="#0D1117"/>

<rect x="8" y="8" width="884" height="414"
rx="16"
fill="none"
stroke="#30363D"
stroke-width="2"/>

<!-- Header -->

<text x="35" y="45" class="title glow">

&gt; PROFILE.EXE

</text>

<!-- Avatar -->
<defs>
  <clipPath id="avatarClip">
    <rect x="70" y="70" width="210" height="280" rx="8"/>
  </clipPath>
</defs>

<image
href="./assets/avatar.png"
x="70"
y="70"
width="210"
height="280"
clip-path="url(#avatarClip)"
preserveAspectRatio="xMidYMid slice"/>
<!-- Scan Line -->

<rect
x="70"
y="70"
width="210"
height="2"
fill="#58A6FF"
opacity=".6">

<animate
attributeName="y"
values="70;348;70"
dur="5s"
repeatCount="indefinite"/>

</rect>

<!-- Scan -->

<rect
x="82"
y="110"
width="196"
height="2"
fill="#58A6FF"
opacity=".6">

<animate
attributeName="y"
values="110;310;110"
dur="4s"
repeatCount="indefinite"/>

</rect>

<!-- Information -->

<text x="340" y="90" class="label">NAME</text>

<text x="520" y="90" class="value">

M. R. Krishni

</text>

<text x="340" y="125" class="label">ROLE</text>

<text x="520" y="125" class="value">

Computer Science Student

</text>

<text x="340" y="160" class="label">UNIVERSITY</text>

<text x="520" y="160" class="value">

VIT Chennai

</text>

<text x="340" y="195" class="label">FOCUS</text>

<text x="520" y="195" class="value">

AI • Machine Learning

</text>

<text x="340" y="230" class="label">OPEN SOURCE</text>

<text x="520" y="230" class="value">

GSSoC Contributor

</text>

<text x="340" y="265" class="label">LANGUAGES</text>

<text x="520" y="265" class="value">

Java • Python • C • SQL

</text>

<text x="340" y="300" class="label">INTERESTS</text>

<text x="520" y="300" class="value">

Astronomy • Japanese

</text>

<text x="340" y="335" class="label">STATUS</text>

<circle
cx="525"
cy="329"
r="6"
class="online">

<animate
attributeName="opacity"
values="1;.3;1"
dur="2s"
repeatCount="indefinite"/>

</circle>

<text x="540" y="335" class="value">

ONLINE

</text>

<!-- Footer -->

<line
x1="35"
y1="375"
x2="865"
y2="375"
stroke="#30363D"
/>

<text
x="35"
y="405"
class="small">

"The universe inspires my curiosity.
Code turns it into reality."

</text>

<text
x="810"
y="405"
class="value">

█

<animate
attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>

</text>

</svg>
