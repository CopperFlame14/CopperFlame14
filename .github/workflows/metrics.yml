name: Metrics

on:
  schedule:
    - cron: "0 */24 * * *"

  workflow_dispatch:

jobs:

  github-metrics:

    runs-on: ubuntu-latest

    permissions:

      contents: write

    steps:

      - uses: lowlighter/metrics@latest

        with:

          token: ${{ secrets.GITHUB_TOKEN }}

          user: CopperFlame14

          template: classic

          base: header, activity, repositories

          plugin_languages: yes

          plugin_isocalendar: yes

          plugin_habits: yes

          plugin_topics: yes

          plugin_followup: yes

          plugin_lines: yes

          config_timezone: Asia/Kolkata
